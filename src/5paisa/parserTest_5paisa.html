		<button id="5paisa_NSE_Cta">Print NSE formated</button>
		<script>
			((d) => {
				const nseCtaBtn = d.getElementById('5paisa_NSE_Cta');
				nseCtaBtn.onclick = function () {
					const txtData = d.getElementById('txtDataInp_5paisa_NSE').value; //.replace(/\s*\/\/.*\n/gim, ''); //we first strip the comments we had added for documenting the lines
					const lines = txtData.split('\n');
					const headerLine = lines.shift(); //remove header line from array
					const consoleTablePrintAry_NSE = [];

					//Exch,ExchType,ScripCode,Name,Expiry,ScripType,StrikeRate,FullName,TickSize,LotSize,QtyLimit,Multiplier,SymbolRoot,BOCOAllowed,ISIN,ScripData,Series

					lines.forEach((line) => {
						const columns = line.split(',');
						if ((columns[16] == 'EQ' || columns[16] == 'SM') && columns.length > 2) {
							if (columns[8] != '0') {
								//if ticksize is not  0, we have tradeable instruments
								consoleTablePrintAry_NSE.push({
									key: columns[3], //symbol
									value: `${columns[2]},${columns[7]},${columns[9]}`, //token,full-name,lotsize
								});
							} else {
								consoleTablePrintAry_NSE.push({
									key: columns[3],
									value: `${columns[2]},,`,
								});
							}
						}
					});
					// console.log('===== NSE =====');
					// console.log('\x1b[43m\x1b[30m===== NSE =====\x1b[0m');
					console.log('%cNSE', 'font-weight:bold;color:black;background:yellow;padding:6px 60px;font-size:16px;margin-top:60px');
					console.table(consoleTablePrintAry_NSE);
				};
			})(document);
		</script>

		<script>
			((d) => {
				const nfoCtaBtn = d.getElementById('5paisa_NFO_Cta'),
					cdsCtaBtn = d.getElementById('5paisa_CDS_Cta'),
					mcxCtaBtn = d.getElementById('5paisa_MCX_Cta');
				nfoCtaBtn.onclick = function () {
					parsNfoData(d.getElementById('txtDataInp_5paisa_NFO').value, 'NFO');
				};
				cdsCtaBtn.onclick = function () {
					parsNfoData(d.getElementById('txtDataInp_5paisa_CDS').value, 'CDS');
				};
				mcxCtaBtn.onclick = function () {
					parsNfoData(d.getElementById('txtDataInp_5paisa_MCX').value, 'MCX');
				};

				function parsNfoData(txtData, conosleTitle) {
					// const txtData = d.getElementById('txtDataInp_5paisa_NFO').value;
					const lines = txtData.split('\n');
					const headerLine = lines.shift(); //remove header line from array
					const consoleTablePrintAry_NFO = [];

					//Exch,ExchType,ScripCode,Name,Expiry,ScripType,StrikeRate,FullName,TickSize,LotSize,QtyLimit,Multiplier,SymbolRoot,BOCOAllowed,ISIN,ScripData,Series
					//Expiry -- 4
					//ScripType -- 5
					//StrikeRate -- 6
					lines.forEach((line) => {
						const columns = line.split(',');
						if (columns.length > 2) {
							if (columns[5] === 'CE') {
								consoleTablePrintAry_NFO.push({
									key: `${columns[12]}|C|${columns[4]}|${columns[6]}`, //symbol|C|expiry|strike
									// value: `${columns[2]},${columns[7]},${columns[9]}`, //token,full-name,lotsize
									value: `${columns[2]},${columns[9]}`, //token,lotsize
								});
							} else if (columns[5] === 'PE') {
								consoleTablePrintAry_NFO.push({
									key: `${columns[12]}|P|${columns[4]}|${columns[6]}`, //symbol|P|expiry|strike
									value: `${columns[2]},${columns[9]}`, //token,lotsize
								});
							} else if (columns[5] === 'XX') {
								consoleTablePrintAry_NFO.push({
									key: `${columns[12]}|F|${columns[4]}|`, //symbol|F|expiry|
									value: `${columns[2]},${columns[9]}`, //token,lotsize
								});
							}
							// }
						}
					});
					// console.log(`===== ${conosleTitle} =====`);
					// console.log(`\x1b[43m\x1b[30m===== ${conosleTitle} =====\x1b[0m`);
					console.log('%c%s', 'font-weight:bold;color:black;background:yellow;padding:6px 60px;font-size:16px;margin-top:60px', conosleTitle);
					console.table(consoleTablePrintAry_NFO);
				}
			})(document);
		</script>
	</body>
