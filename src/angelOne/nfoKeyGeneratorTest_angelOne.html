				/** Converts date-string to a standardized format (yyyy-mm-dd) used in cross-broker std primary-key */
				function _convertTo_stdPk_dateFormat(inputDateStr) {
					const date = new Date(inputDateStr);
					const year = date.getFullYear();
					const month = String(date.getMonth() + 1).padStart(2, '0');
					const day = String(date.getDate()).padStart(2, '0');
					return `${year}-${month}-${day}`;
				}

							}

							} else {
								//instrumenttype === ''
								consoleTablePrintAry_BSE.push({ key: name, value: `${token},${lotsize}` }); //bseTable.put(`${token},${lotsize},`, name);

							}

								// mcxTable.put(

								consoleTablePrintAry_MCX.push({ key: `${name}|F|${_convertTo_stdPk_dateFormat(expiry)}|`, value: `${token},${lotsize}` });
